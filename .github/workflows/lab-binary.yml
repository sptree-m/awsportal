name: Lab ARM64 binary
on:
  push:
    branches: [work/cloudshell-lab]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Resolve modules
        run: go mod download
      - name: Build ARM64 binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/awsportal ./cmd/awsportal
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/awsportal-admin ./cmd/awsportal-admin
          tar -C dist -czf awsportal-linux-arm64.tar.gz awsportal awsportal-admin
          sha256sum awsportal-linux-arm64.tar.gz > awsportal-linux-arm64.tar.gz.sha256
      - name: Publish lab bootstrap release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete lab-bootstrap --cleanup-tag -y || true
          gh release create lab-bootstrap awsportal-linux-arm64.tar.gz awsportal-linux-arm64.tar.gz.sha256 --title "Lab bootstrap" --notes "Disposable ARM64 lab bootstrap binaries"
