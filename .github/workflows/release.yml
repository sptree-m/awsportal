name: Release
on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Resolve Go modules
        run: go mod download

      - name: Build and publish ARM64
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          V="$(tr -d '[:space:]' < VERSION)"
          TAG="v$V"
          ASSET="awsportal-$TAG-linux-arm64.tar.gz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            if grep -Fxq "$ASSET" <<<"$ASSETS" && grep -Fxq "$ASSET.sha256" <<<"$ASSETS"; then
              rm -rf dist/existing
              mkdir -p dist/existing
              if gh release download "$TAG" -p "$ASSET" -p "$ASSET.sha256" -D dist/existing; then
                EXPECTED="$(awk '{print $1}' "dist/existing/$ASSET.sha256")"
                ACTUAL="$(sha256sum "dist/existing/$ASSET" | awk '{print $1}')"
                CONTENTS="$(tar -tzf "dist/existing/$ASSET" 2>/dev/null || true)"
                if [ -n "$EXPECTED" ] && [ "$EXPECTED" = "$ACTUAL" ] \
                  && grep -Fxq "awsportal" <<<"$CONTENTS" \
                  && grep -Fxq "awsportal-admin" <<<"$CONTENTS" \
                  && [ "$(wc -l <<<"$CONTENTS" | tr -d ' ')" -eq 6 ]; then
                  echo "$TAG already exists and archive/checksum are valid"
                  exit 0
                fi
              fi
            fi
            echo "$TAG exists but assets are incomplete or invalid; rebuilding/uploading"
          fi
          mkdir -p dist/pkg/dcv
          cp dcv/agent.py dcv/install.sh dcv/desktop.sh dcv/awsportal-job dist/pkg/dcv/
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/pkg/awsportal ./cmd/awsportal
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/pkg/awsportal-admin ./cmd/awsportal-admin
          test -x dist/pkg/awsportal
          test -x dist/pkg/awsportal-admin
          tar -C dist/pkg -czf "dist/$ASSET" awsportal awsportal-admin dcv/agent.py dcv/install.sh dcv/desktop.sh dcv/awsportal-job
          CONTENTS="$(tar -tzf "dist/$ASSET")"
          grep -Fxq "awsportal" <<<"$CONTENTS"
          grep -Fxq "awsportal-admin" <<<"$CONTENTS"
          for FILE in dcv/agent.py dcv/install.sh dcv/desktop.sh dcv/awsportal-job; do
            grep -Fxq "$FILE" <<<"$CONTENTS"
          done
          test "$(wc -l <<<"$CONTENTS" | tr -d ' ')" -eq 6
          sha256sum "dist/$ASSET" > "dist/$ASSET.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$ASSET" "dist/$ASSET.sha256" --clobber
          else
            gh release create "$TAG" "dist/$ASSET" "dist/$ASSET.sha256" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi

      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          V="$(tr -d '[:space:]' < VERSION)"
          TAG="v$V"
          ASSET="awsportal-$TAG-linux-arm64.tar.gz"
          gh release view "$TAG" >/dev/null
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          grep -Fxq "$ASSET" <<<"$ASSETS"
          grep -Fxq "$ASSET.sha256" <<<"$ASSETS"
          rm -rf dist/verify
          mkdir -p dist/verify
          gh release download "$TAG" -p "$ASSET" -p "$ASSET.sha256" -D dist/verify
          EXPECTED="$(awk '{print $1}' "dist/verify/$ASSET.sha256")"
          ACTUAL="$(sha256sum "dist/verify/$ASSET" | awk '{print $1}')"
          test -n "$EXPECTED"
          test "$EXPECTED" = "$ACTUAL"
          CONTENTS="$(tar -tzf "dist/verify/$ASSET")"
          grep -Fxq "awsportal" <<<"$CONTENTS"
          grep -Fxq "awsportal-admin" <<<"$CONTENTS"
          for FILE in dcv/agent.py dcv/install.sh dcv/desktop.sh dcv/awsportal-job; do
            grep -Fxq "$FILE" <<<"$CONTENTS"
          done
          test "$(wc -l <<<"$CONTENTS" | tr -d ' ')" -eq 6
          echo "RESULT: PASS - $TAG ARM64 release archive and checksum verified"
