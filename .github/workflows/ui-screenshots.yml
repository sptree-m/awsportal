name: UI screenshots
on:
  push:
    branches: [main, ci/ui-visual-artifacts]
    paths:
      - cmd/awsportal/web/**
      - scripts/capture-ui.sh
      - .github/workflows/ui-screenshots.yml
  pull_request:
    paths:
      - cmd/awsportal/web/**
      - scripts/capture-ui.sh
      - .github/workflows/ui-screenshots.yml
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture 1366 / FHD / 2K / 4K
        run: bash scripts/capture-ui.sh
      - name: Verify screenshots
        run: |
          test -s docs/screenshots/dashboard-1366x768.png
          test -s docs/screenshots/dashboard-1920x1080.png
          test -s docs/screenshots/dashboard-2560x1440.png
          test -s docs/screenshots/dashboard-3840x2160.png
          test -s docs/screenshots/login-1366x768.png
      - name: Upload visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-${{ github.sha }}
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
