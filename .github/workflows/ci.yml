name: 必須テスト
on:
  push:
  pull_request:
jobs:
  test:
    name: unit-security-terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Install Git LFS for real integration tests
        run: sudo apt-get update -qq && sudo apt-get install -y git-lfs
      - name: Install CloudFormation validation tools
        run: pip install 'cfn-lint==1.40.2'
      - uses: hashicorp/setup-terraform@v3
      - run: bash scripts/test-all.sh

  t4g-micro-arm64:
    name: t4g-micro-arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: t4g.micro相当リソース制約テスト
        run: bash scripts/test-t4g-micro.sh

  browser-console:
    name: htmx-browser-console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/ui-tools" playwright@1.51.1
          "$RUNNER_TEMP/ui-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test real server and bundled htmx at four resolutions
        env:
          AWSPORTAL_BROWSER_TEST: '1'
          NODE_PATH: ${{ runner.temp }}/ui-tools/node_modules
          AWSPORTAL_SCREENSHOT_DIR: ${{ runner.temp }}/ui-screenshots
        run: |
          mkdir -p "$AWSPORTAL_SCREENSHOT_DIR"
          go test -race ./cmd/awsportal -run TestBrowserConsole -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: htmx-console-screenshots
          path: ${{ runner.temp }}/ui-screenshots

  windows-import:
    name: windows-import-syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows scripts and verify CLI argument boundaries
        shell: pwsh
        run: ./tests/parse-windows.ps1
