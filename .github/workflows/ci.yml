name: 必須テスト
on:
  push:
  pull_request:
jobs:
  test:
    name: unit-security-terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - uses: hashicorp/setup-terraform@v3
      - run: bash scripts/test-all.sh

  t4g-micro-arm64:
    name: t4g-micro-arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: t4g.micro相当リソース制約テスト
        run: bash scripts/test-t4g-micro.sh
