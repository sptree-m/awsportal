AWSTemplateFormatVersion: '2010-09-09'
Description: awsportal isolated disposable lab
Parameters:
  AllowedCidr: {Type: String}
  ProjectTag: {Type: String, Default: awsportal-lab}
  LabPassword: {Type: String, NoEcho: true, MinLength: 12}
  LabTOTPSecret: {Type: String, NoEcho: true, MinLength: 16}
  InstanceType: {Type: String, Default: t4g.micro}
  BinaryURL: {Type: String}
  DCVPort:
    Type: String
    Default: '8443'
    AllowedPattern: '^(?!(22|3389|8444)$)([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$'
    ConstraintDescription: 'Integer TCP port except 22, 3389 and authentication broker port 8444'
  DCVAgentToken: {Type: String, NoEcho: true, MinLength: 64, MaxLength: 64}
  LabTLSCert: {Type: String, NoEcho: true}
  LabTLSKey: {Type: String, NoEcho: true}
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties: {CidrBlock: 10.77.0.0/24, EnableDnsSupport: true, EnableDnsHostnames: true, Tags: [{Key: Project, Value: {Ref: ProjectTag}}]}
  Igw: {Type: AWS::EC2::InternetGateway, Properties: {Tags: [{Key: Project, Value: {Ref: ProjectTag}}]}}
  Attach: {Type: AWS::EC2::VPCGatewayAttachment, Properties: {VpcId: {Ref: Vpc}, InternetGatewayId: {Ref: Igw}}}
  Subnet:
    Type: AWS::EC2::Subnet
    Properties: {VpcId: {Ref: Vpc}, CidrBlock: 10.77.0.0/26, MapPublicIpOnLaunch: true, Tags: [{Key: Project, Value: {Ref: ProjectTag}}]}
  RouteTable: {Type: AWS::EC2::RouteTable, Properties: {VpcId: {Ref: Vpc}, Tags: [{Key: Project, Value: {Ref: ProjectTag}}]}}
  Route: {Type: AWS::EC2::Route, DependsOn: Attach, Properties: {RouteTableId: {Ref: RouteTable}, DestinationCidrBlock: 0.0.0.0/0, GatewayId: {Ref: Igw}}}
  Assoc: {Type: AWS::EC2::SubnetRouteTableAssociation, Properties: {SubnetId: {Ref: Subnet}, RouteTableId: {Ref: RouteTable}}}
  PortalSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: awsportal lab browser only
      VpcId: {Ref: Vpc}
      SecurityGroupIngress: [{IpProtocol: tcp, FromPort: 8080, ToPort: 8080, CidrIp: {Ref: AllowedCidr}}]
      SecurityGroupEgress: [{IpProtocol: -1, CidrIp: 0.0.0.0/0}]
      Tags: [{Key: Project, Value: {Ref: ProjectTag}}]
  PortalAgentIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: {Ref: PortalSG}, IpProtocol: tcp, FromPort: 8444, ToPort: 8444, SourceSecurityGroupId: {Ref: TestSG}}
  TestRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: 'sts:AssumeRole'}]}
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore]
      Policies:
        - PolicyName: DCVLicenseRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: {Fn::Sub: 'arn:${AWS::Partition}:s3:::dcv-license.${AWS::Region}/*'}
  TestProfile: {Type: AWS::IAM::InstanceProfile, Properties: {Roles: [{Ref: TestRole}]}}
  TestSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: awsportal lab DCV only
      VpcId: {Ref: Vpc}
      SecurityGroupIngress: [{IpProtocol: tcp, FromPort: {Ref: DCVPort}, ToPort: {Ref: DCVPort}, CidrIp: {Ref: AllowedCidr}}]
      SecurityGroupEgress: [{IpProtocol: -1, CidrIp: 0.0.0.0/0}]
      Tags: [{Key: Project, Value: {Ref: ProjectTag}}]
  PortalRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: 'sts:AssumeRole'}]}
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: awsportal-lab
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: ['ec2:DescribeInstances','ec2:DescribeInstanceStatus'], Resource: '*'}
              - {Effect: Allow, Action: ['ec2:StartInstances','ec2:StopInstances'], Resource: '*', Condition: {StringEquals: {'ec2:ResourceTag/Project': {Ref: ProjectTag}}}}
              - {Effect: Allow, Action: 'ce:GetCostAndUsage', Resource: '*'}
  PortalProfile: {Type: AWS::IAM::InstanceProfile, Properties: {Roles: [{Ref: PortalRole}]}}
  TestInstance:
    Type: AWS::EC2::Instance
    DependsOn: [Route, Assoc]
    Properties:
      IamInstanceProfile: {Ref: TestProfile}
      PrivateIpAddress: 10.77.0.11
      ImageId: '{{resolve:ssm:/aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id}}'
      InstanceType: {Ref: InstanceType}
      SubnetId: {Ref: Subnet}
      SecurityGroupIds: [{Ref: TestSG}]
      MetadataOptions: {HttpTokens: required}
      BlockDeviceMappings: [{DeviceName: /dev/sda1, Ebs: {VolumeType: gp3, VolumeSize: 16, Encrypted: true, DeleteOnTermination: true}}]
      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/bin/bash
            set -euo pipefail
            umask 077
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y curl ca-certificates
            snap list amazon-ssm-agent >/dev/null 2>&1 || snap install amazon-ssm-agent --classic
            snap start amazon-ssm-agent
            mkdir -p /tmp/awsportal-bin /etc/awsportal-dcv
            curl -fL --retry 5 '${BinaryURL}' -o /tmp/awsportal.tar.gz
            curl -fL --retry 5 '${BinaryURL}.sha256' -o /tmp/awsportal.tar.gz.sha256
            test "$(awk '{print $1}' /tmp/awsportal.tar.gz.sha256)" = "$(sha256sum /tmp/awsportal.tar.gz | awk '{print $1}')"
            tar -xzf /tmp/awsportal.tar.gz -C /tmp/awsportal-bin
            echo '${LabTLSCert}' | base64 -d > /etc/awsportal-dcv/portal-ca.pem
            IMDS_TOKEN="$(curl -fsS -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' http://169.254.169.254/latest/api/token)"
            THIS_ID="$(curl -fsS -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" http://169.254.169.254/latest/meta-data/instance-id)"
            cat > /etc/awsportal-dcv/config.json <<CONFIG
            {"portal_url":"https://10.77.0.10:8444","instance_id":"$THIS_ID","token":"${DCVAgentToken}","ca_file":"/etc/awsportal-dcv/portal-ca.pem"}
            CONFIG
            chmod 600 /etc/awsportal-dcv/config.json
            # Swap keeps the two debug virtual desktops usable on t4g.micro.
            fallocate -l 2G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
            AWSPORTAL_DCV_PORT='${DCVPort}' bash /tmp/awsportal-bin/dcv/install.sh
      Tags: [{Key: Name, Value: awsportal-lab-test}, {Key: Project, Value: {Ref: ProjectTag}}, {Key: awsportal-user, Value: test-user01}]
  PortalInstance:
    Type: AWS::EC2::Instance
    DependsOn: [Route, Assoc, PortalAgentIngress]
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id}}'
      InstanceType: {Ref: InstanceType}
      IamInstanceProfile: {Ref: PortalProfile}
      PrivateIpAddress: 10.77.0.10
      SubnetId: {Ref: Subnet}
      SecurityGroupIds: [{Ref: PortalSG}]
      MetadataOptions: {HttpTokens: required}
      BlockDeviceMappings: [{DeviceName: /dev/sda1, Ebs: {VolumeType: gp3, VolumeSize: 8, Encrypted: true, DeleteOnTermination: true}}]
      Tags: [{Key: Name, Value: awsportal-lab-portal}, {Key: Project, Value: {Ref: ProjectTag}}, {Key: awsportal-user, Value: portal}]
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash
              set -euo pipefail
              umask 077
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y curl sqlite3 ca-certificates git git-lfs nginx
              useradd --system --home /var/lib/awsportal --create-home awsportal
              mkdir -p /tmp/awsportal-bin
              curl -fL --retry 5 --retry-delay 2 "${BinaryURL}" -o /tmp/awsportal.tar.gz
              curl -fL --retry 5 --retry-delay 2 "${BinaryURL}.sha256" -o /tmp/awsportal.tar.gz.sha256
              EXPECTED="$(awk '{print $1}' /tmp/awsportal.tar.gz.sha256)"
              ACTUAL="$(sha256sum /tmp/awsportal.tar.gz | awk '{print $1}')"
              test -n "$EXPECTED"
              test "$EXPECTED" = "$ACTUAL"
              tar -xzf /tmp/awsportal.tar.gz -C /tmp/awsportal-bin
              test -s /tmp/awsportal-bin/awsportal
              test -s /tmp/awsportal-bin/awsportal-admin
              install -m 0755 /tmp/awsportal-bin/awsportal /usr/local/bin/awsportal
              install -m 0755 /tmp/awsportal-bin/awsportal-admin /usr/local/bin/awsportal-admin
              PASS="${LabPassword}"
              /usr/local/bin/awsportal-admin -db /var/lib/awsportal/awsportal.db -cmd create-user -user labadmin -password "$PASS" -role user > /tmp/admin.txt
              sqlite3 /var/lib/awsportal/awsportal.db "UPDATE users SET role='portal_admin', totp_secret='${LabTOTPSecret}' WHERE username='labadmin';"
              /usr/local/bin/awsportal-admin -db /var/lib/awsportal/awsportal.db -cmd add-instance -instance ${TestId} -name "Ubuntu test" -host ec2-public
              echo "${DCVAgentToken}" > /tmp/dcv-agent-token
              /usr/local/bin/awsportal-admin -db /var/lib/awsportal/awsportal.db -cmd configure-dcv -instance ${TestId} -host ec2-public -dcv-mode native -dcv-token-file /tmp/dcv-agent-token
              rm /tmp/dcv-agent-token

              # Lab-only MFA-free debug user (disabled by default)
              DEBUGPASS="Debug-$PASS"
              /usr/local/bin/awsportal-admin -db /var/lib/awsportal/awsportal.db -cmd create-user -user labdebug -password "$DEBUGPASS" -role user

              sqlite3 /var/lib/awsportal/awsportal.db "INSERT INTO instance_users(instance_id,user_id,can_control) SELECT i.id,u.id,1 FROM instances i,users u WHERE i.instance_id='${TestId}' AND u.username='labdebug';"
              sqlite3 /var/lib/awsportal/awsportal.db "UPDATE users SET enabled=0 WHERE username='labdebug';"

              chown -R awsportal:awsportal /var/lib/awsportal
              cat >/var/lib/awsportal/lab-login.txt <<EOF
              username=labadmin
              password=$PASS
              debug_username=labdebug
              debug_password=$DEBUGPASS
              $(cat /tmp/admin.txt)
              EOF
              chmod 600 /var/lib/awsportal/lab-login.txt
              cat >/etc/systemd/system/awsportal.service <<'UNIT'
              [Unit]
              After=network-online.target
              [Service]
              User=awsportal
              WorkingDirectory=/var/lib/awsportal
              Environment=AWSPORTAL_DB=/var/lib/awsportal/awsportal.db
              Environment=AWSPORTAL_ADDR=:8080
              Environment=AWSPORTAL_DCV_PORT=${DCVPort}
              Environment=AWSPORTAL_COOKIE_SECURE=0
              Environment=AWSPORTAL_LAB_DEBUG_AUTH=1
              Environment=AWS_REGION=${AWS::Region}
              Environment=AWS_DEFAULT_REGION=${AWS::Region}
              ExecStart=/usr/local/bin/awsportal
              Restart=always
              RestartSec=2
              [Install]
              WantedBy=multi-user.target
              UNIT
              mkdir -p /etc/awsportal-tls
              echo '${LabTLSCert}' | base64 -d > /etc/awsportal-tls/server.pem
              echo '${LabTLSKey}' | base64 -d > /etc/awsportal-tls/server.key
              chmod 600 /etc/awsportal-tls/server.key
              rm -f /etc/nginx/sites-enabled/default
              cat > /etc/nginx/sites-available/awsportal-agent <<'NGINX'
              server {
                listen 8444 ssl;
                ssl_certificate /etc/awsportal-tls/server.pem;
                ssl_certificate_key /etc/awsportal-tls/server.key;
                ssl_protocols TLSv1.2 TLSv1.3;
                location /api/dcv/agent/ {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Authorization $http_authorization;
                  proxy_read_timeout 20s;
                }
                location / { return 404; }
              }
              NGINX
              ln -sf /etc/nginx/sites-available/awsportal-agent /etc/nginx/sites-enabled/awsportal-agent
              nginx -t
              systemctl restart nginx
              systemctl daemon-reload
              systemctl enable --now awsportal
            - {TestId: {Ref: TestInstance}, LabPassword: {Ref: LabPassword}, LabTOTPSecret: {Ref: LabTOTPSecret}, BinaryURL: {Ref: BinaryURL}}
Outputs:
  PortalURL: {Value: {Fn::Sub: 'http://${PortalInstance.PublicIp}:8080'}}
  PortalInstanceId: {Value: {Ref: PortalInstance}}
  TestInstanceId: {Value: {Ref: TestInstance}}
  DCVPort: {Value: {Ref: DCVPort}}
  DCVURL: {Value: {Fn::Sub: 'https://${TestInstance.PublicIp}:${DCVPort}'}}
