{{define "user-row.html"}}<tr data-user="{{.Username}}"><td><strong>{{.Username}}</strong></td><td><code>{{.Role}}</code></td><td><span class="user-status">{{.Status}}</span></td><td>{{.LastLogin}}</td><td>{{.Expires}}</td><td>{{if ne .Role "portal_admin"}}{{.Days}}{{else}}—{{end}}</td><td>{{if ne .Role "portal_admin"}}{{if eq .Status "無効"}}<form method="post" action="/admin/users/{{.Username}}/reactivate" hx-post="/admin/users/{{.Username}}/reactivate" hx-target="closest tr" hx-swap="outerHTML swap:60ms settle:60ms" hx-disabled-elt="find button"><button>再有効化</button></form>{{else}}<form method="post" action="/admin/users/{{.Username}}/disable" hx-post="/admin/users/{{.Username}}/disable" hx-target="closest tr" hx-swap="outerHTML swap:60ms settle:60ms" hx-disabled-elt="find button"><button class="danger">無効化</button></form>{{end}}{{else}}—{{end}}</td></tr>{{end}}
