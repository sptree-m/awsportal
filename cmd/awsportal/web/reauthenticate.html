{{define "reauthenticate.html"}}<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="csrf-token" content="{{.CSRF}}"><title>操作の本人確認 | {{.Site.BrandTitle}}</title><link rel="stylesheet" href="/static/web/app.css"><script src="/static/web/passkeys.js?v=security-2" defer></script></head><body class="login"><main class="card"><h1>操作の本人確認</h1><p>{{.Operation}}の前に、登録済みの認証要素で確認してください。確認後に操作画面へ戻り、もう一度操作してください。</p><form data-passkey="reauth"><input type="hidden" name="action" value="{{.Action}}"><button>登録済みパスキーで確認</button><p data-passkey-error role="alert"></p></form>{{if eq .User.Role "portal_admin"}}<details><summary>パスワードとTOTPで確認</summary><form method="post" action="/reauthenticate" data-reauth-password><input type="hidden" name="action" value="{{.Action}}"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>現在のパスワード<input name="password" type="password" autocomplete="current-password" required></label><label>TOTP<input name="totp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label><p>直前に使ったTOTPは再利用できません。次のコードを入力してください。</p><button>確認して操作画面へ戻る</button><p data-passkey-error role="alert"></p></form></details>{{end}}<a href="/">Dashboardへ戻る</a></main></body></html>{{end}}
