{{define "login.html"}}<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.Site.BrandTitle}}</title><link rel="stylesheet" href="/static/web/app.css?v=site-manuals-1"></head><body class="login"><main class="card auth-card"><div class="auth-brand">{{template "site-brand" .}}</div><p class="eyebrow">SECURE ACCESS</p><h1>ログイン</h1><p class="muted site-message">{{.Site.LoginMessage}}</p><form method="post" action="/login"><label>ユーザー名<input name="username" autocomplete="username" autofocus required></label><label>パスワード<input type="password" name="password" autocomplete="current-password" required></label><label>認証コード <small class="muted">MFA設定時</small><input name="totp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000"></label><button class="primary full">ログイン</button></form></main></body></html>{{end}}
