{{define "instance-row.html"}}<tr data-instance="{{.InstanceID}}" data-state="{{.State}}" data-search="{{.Name}} {{.InstanceID}}"{{if or (eq .State "pending") (eq .State "stopping") (eq .State "shutting-down")}} hx-get="/instances/{{.InstanceID}}/row" hx-trigger="load delay:1500ms" hx-target="this" hx-swap="outerHTML swap:60ms settle:60ms"{{end}}><td><strong>{{.Name}}</strong></td><td><span class="state state-{{.State}}"><span class="state-dot"></span><span>{{.State}}</span></span>{{if .Note}}<small class="state-note">{{.Note}}</small>{{end}}</td><td><code>{{.InstanceID}}</code></td><td>{{if eq .State "running"}}<a class="btn mini primary" href="/dcv/{{.InstanceID}}">接続</a>{{else}}<span class="btn mini disabled" aria-disabled="true">接続</span>{{end}}</td><td><div class="power-control">{{if .CanControl}}{{if eq .State "stopped"}}<form method="post" action="/instance/{{.InstanceID}}/start" hx-post="/instance/{{.InstanceID}}/start" hx-target="closest tr" hx-swap="outerHTML swap:60ms settle:60ms" hx-disabled-elt="find button"><button class="power-start">起動</button></form>{{else if eq .State "running"}}<form method="post" action="/instance/{{.InstanceID}}/stop" hx-post="/instance/{{.InstanceID}}/stop" hx-target="closest tr" hx-swap="outerHTML swap:60ms settle:60ms" hx-disabled-elt="find button"><button class="power-stop">停止</button></form>{{else}}<span class="muted">処理中…</span>{{end}}{{else}}<span class="muted">閲覧のみ</span>{{end}}</div></td><td><a class="btn mini" href="/instances/{{.InstanceID}}">詳細</a></td></tr>{{end}}
