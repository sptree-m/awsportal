{{define "passkey-enroll.html"}}<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>パスキー登録 | {{.Site.BrandTitle}}</title><link rel="stylesheet" href="/static/web/app.css"><script src="/static/web/passkeys.js?v=passkeys-1" defer></script></head><body class="login"><main class="card auth-card"><div class="auth-brand">{{template "site-brand" .}}</div><h1>パスキー登録</h1><p class="muted">管理者から受け取った登録コードを入力し、この配布PCのPIN・指紋・顔認証で登録してください。クラウド同期は使用できません。</p><form data-passkey="register"><label>ユーザー名<input name="username" autocomplete="username" required></label><label>登録コード<input type="password" name="code" autocomplete="off" required></label><label>PC名<input name="name" maxlength="80" autocomplete="off" required></label><button class="primary full">このPCに登録</button><p role="alert" aria-live="polite" data-passkey-error></p></form><a class="btn" href="/login">ログインへ戻る</a></main></body></html>{{end}}
